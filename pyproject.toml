[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "greet-community"
version = "0.1.0"
description = "Greeting package for community"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PJY42" }]

[tool.setuptools.packages.find]
where = ["src"]
